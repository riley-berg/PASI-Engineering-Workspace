name: github-project-v2

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Project owner login, or owner/name for a repository-owned project"
        required: true
        default: "th3-st0v3"
      owner_type:
        description: "Project owner type"
        required: true
        type: choice
        options:
          - user
          - organization
          - repository
        default: user
      project_number:
        description: "GitHub Project v2 number"
        required: true
        default: "1"
      item_repo:
        description: "Repository containing the issue/PR"
        required: true
        default: "th3-st0v3/PASI-Engineering-Workspace"
      item_number:
        description: "Issue or pull request number"
        required: true
      field:
        description: "Project field name"
        required: true
      kind:
        description: "Field value type"
        required: true
        type: choice
        options:
          - auto
          - date
          - iteration
          - single-select
          - number
          - text
        default: auto
      value:
        description: "Human-readable value (date, iteration title, or option name)"
        required: true

permissions:
  contents: read

concurrency:
  group: github-project-v2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Update Project v2 field
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/github_project_v2.py             --owner "${{ inputs.owner }}"             --owner-type "${{ inputs.owner_type }}"             --project-number "${{ inputs.project_number }}"             set             --item-repo "${{ inputs.item_repo }}"             --item-number "${{ inputs.item_number }}"             --field "${{ inputs.field }}"             --kind "${{ inputs.kind }}"             --value "${{ inputs.value }}"
