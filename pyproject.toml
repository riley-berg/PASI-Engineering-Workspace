[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pasi-engineering-workspace"
version = "0.1.0"
description = "Roadmap-driven PASI automation core"
requires-python = ">=3.12"
dependencies = ["cryptography>=50.0.1,<51"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
