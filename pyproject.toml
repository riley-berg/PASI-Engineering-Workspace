[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pasi-engineering-workspace"
version = "0.1.0"
description = "Roadmap-driven PASI automation core"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "mcp>=2,<3",
]
agent = [
  "mcp>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
