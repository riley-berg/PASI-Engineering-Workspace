<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PASI Userscripts</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">PASI</p>
        <h1>Userscripts</h1>
        <p class="subhead">Manage native MV3 userscripts, host access, tags, backups, and sync.</p>
      </div>
      <button id="reload" type="button">Refresh</button>
    </header>

    <section class="cloudbar"><input id="cloud-endpoint" type="url" placeholder="WebDAV endpoint"><input id="cloud-file" value="pasi-userscripts-backup.json" placeholder="backup filename"><input id="cloud-user" placeholder="WebDAV username"><input id="cloud-pass" type="password" placeholder="WebDAV password"><button id="cloud-save" type="button">Save cloud</button><button id="cloud-status" type="button">Check cloud</button><button id="cloud-push" type="button">Push backup</button><button id="cloud-pull" type="button">Pull backup</button><span id="cloud-state"></span></section>

    <section class="toolbar" aria-label="Userscript tools">
      <input id="search" type="search" placeholder="Search scripts, tags, hosts">
      <select id="group"><option value="">All groups</option></select>
      <button id="backup" type="button">Export backup</button>
      <label class="file-button">Import backup<input id="restore-file" type="file" accept="application/json"></label>
      <button id="sync" type="button">Sync now</button><input id="install-url" type="url" placeholder="https://…/userscript.js"><button id="install" type="button">Install URL</button>
    </section>

    <section id="status" class="status" role="status"></section>
    <section id="conflict" class="conflict" hidden></section>
    <section id="scripts" class="scripts"></section>
  <script src="src/userscript_diff.js"></script>
  </main>
  <script src="options.js"></script>
</body>
</html>
