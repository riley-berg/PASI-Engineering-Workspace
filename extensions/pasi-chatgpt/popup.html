<!doctype html>
<html lang="en" style="background:#0B0D10;color-scheme:dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>PASI Dashboard</title>
  <script src="theme-init.js"></script>
  <style id="pasi-theme-critical">
    html {
      background: #0B0D10;
      color-scheme: dark;
    }

    html.light-theme {
      background: #F5F7FA;
      color-scheme: light;
    }

    body {
      background: #0B0D10;
      color: #F5F7FA;
    }

    html.light-theme body {
      background: #F5F7FA;
      color: #171A20;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
    }
  </style>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand-group">
      <span class="brand">PASI Dashboard</span>
      <span id="connectionBadge" class="status-badge">Connected</span>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" title="Switch to light theme" aria-label="Switch to light theme">🌙</button>
  </header>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main id="runnerCards" class="runners-list" aria-label="PASI runners"></main>

  <details id="runnerManagement" class="runner-management">
    <summary>Runner management</summary>
    <div class="runner-management-body">
      <div id="runnerRegistryList" class="runner-registry-list" aria-live="polite"></div>

      <form id="createRunnerForm" class="runner-form">
        <div class="runner-form-title">Create runner</div>
        <label>Runner ID <input id="createRunnerId" name="id" autocomplete="off" placeholder="my-runner" required></label>
        <label>Name <input id="createRunnerName" name="name" autocomplete="off" placeholder="My runner" required></label>
        <label>Workspace script <input id="createRunnerEntrypoint" name="entrypoint" autocomplete="off" placeholder="scripts/my_runner.py" required></label>
        <label>Args JSON <input id="createRunnerArgs" name="args" autocomplete="off" placeholder='["--mode","acceptance"]'></label>
        <button id="createRunnerButton" class="btn btn-secondary" type="submit">Create runner</button>
      </form>

      <form id="createRevisionForm" class="runner-form">
        <div class="runner-form-title">Stage revised runner</div>
        <label>Runner ID <input id="revisionRunnerId" name="id" autocomplete="off" placeholder="my-runner" required></label>
        <label>Workspace script <input id="revisionEntrypoint" name="entrypoint" autocomplete="off" placeholder="scripts/my_runner_v2.py" required></label>
        <label>Args JSON <input id="revisionArgs" name="args" autocomplete="off" placeholder='["--mode","acceptance-v2"]'></label>
        <button id="createRevisionButton" class="btn btn-secondary" type="submit">Stage candidate</button>
      </form>
    </div>
  </details>

  <section id="scripts" aria-label="PASI userscripts"></section>

  <section id="idleState" class="idle-state" hidden aria-live="polite">
    <div class="idle-icon" aria-hidden="true">⚠️</div>
    <div class="idle-title">Page not authorized</div>
    <div class="idle-copy">This page is not authorized for the PASI extension.</div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
