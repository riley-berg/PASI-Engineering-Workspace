name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: P0.4 clean-environment smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          env -u PYTHONPATH python scripts/pasi_168h_acceptance.py --hours 168 --smoke
          bash -n scripts/run_p0_4_168h.sh
      - name: P0.4 production launcher smoke
        env:
          PASI_GITHUB_TOKEN: ${{ github.token }}
          PASI_PYTHON: python
          PASI_168H_SMOKE: '1'
          PASI_ACCEPTANCE_STATE_DIR: ${{ runner.temp }}/pasi-168h-smoke
        run: |
          env -u PYTHONPATH ./scripts/run_p0_4_168h.sh
      - name: P0.4 fresh-checkout launcher bootstrap
        env:
          PASI_GITHUB_TOKEN: ${{ github.token }}
          PASI_PYTHON: ''
          PASI_168H_SMOKE: '1'
          PASI_ACCEPTANCE_STATE_DIR: ${{ runner.temp }}/pasi-168h-fresh-checkout
        run: |
          rm -rf .venv
          env -u PYTHONPATH ./scripts/run_p0_4_168h.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend tests
        run: node --test web/app.test.js
