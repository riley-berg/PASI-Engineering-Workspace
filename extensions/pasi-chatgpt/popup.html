<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PASI Dashboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand-group">
      <span class="brand">PASI Dashboard</span>
      <span id="connectionBadge" class="status-badge">Ready</span>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" title="Switch to light theme" aria-label="Switch to light theme">🌙</button>
  </header>

  <section id="runnerControls" class="runner-controls" aria-label="Runner controls">
    <label class="profile-summary" for="runnerSelect">
      <span>Selected runner</span>
      <select id="runnerSelect" aria-label="Selected runner">
        <option value="m1">M1 · 20-operation acceptance</option>
        <option value="168h">168h · long-run acceptance</option>
      </select>
    </label>
    <button id="runNextButton" class="btn btn-secondary queue-button" type="button">
      Run next queued op
    </button>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main id="runnerCards" class="runners-list" aria-label="PASI runners"></main>

  <section id="scripts" aria-label="PASI userscripts"></section>

  <section id="idleState" class="idle-state" hidden aria-live="polite">
    <div class="idle-icon" aria-hidden="true">⚠️</div>
    <div class="idle-title">Extension idle</div>
    <div class="idle-copy">Navigate to a supported page to activate userscripts.</div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
