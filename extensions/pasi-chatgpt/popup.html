<!doctype html>
<html lang="en" style="background:#0D0E11;color-scheme:dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>PASI Dashboard</title>
  <script src="theme-init.js"></script>
  <style id="pasi-theme-critical">
    html {
      background: #0D0E11;
      color-scheme: dark;
    }

    html.light-theme {
      background: #FAF8F5;
      color-scheme: light;
    }

    body {
      background: #0D0E11;
      color: #F4F1EC;
    }

    html.light-theme body {
      background: #FAF8F5;
      color: #1A1B20;
    }

    .runner-select {
      background: #17191E;
      border: 1px solid #292A2E;
      border-radius: 6px;
      color: #F4F1EC;
      -webkit-appearance: none;
      appearance: none;
    }

    html.light-theme .runner-select {
      background: #FFFFFF;
      border-color: #DCD4C7;
      color: #1A1B20;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
    }

    .idle-state {
      background: rgba(23, 25, 30, .78);
    }

    html.light-theme .idle-state {
      background: rgba(255, 255, 255, .95);
    }
  </style>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand-group">
      <span class="brand">PASI Dashboard</span>
      <span id="connectionBadge" class="status-badge">Connected</span>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" title="Switch to light theme" aria-label="Switch to light theme">🌙</button>
  </header>

  <section id="runnerControls" class="runner-controls" aria-label="Runner controls">
    <div class="profile-summary">
      <span class="profile-label">Selected runner</span>
      <div class="runner-picker">
        <button
          id="runnerSelect"
          class="runner-select"
          type="button"
          role="combobox"
          aria-label="Selected runner"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="runnerSelectMenu"
        >
          <span id="runnerSelectLabel">M1 · Acceptance</span>
          <span class="runner-select-chevron" aria-hidden="true">▾</span>
        </button>
        <div id="runnerSelectMenu" class="runner-select-menu" role="listbox" hidden>
          <div id="runnerOption-m1" class="runner-select-option" role="option" aria-selected="true" data-value="m1" tabindex="-1">M1 · 20-operation acceptance</div>
          <div id="runnerOption-168h" class="runner-select-option" role="option" aria-selected="false" data-value="168h" tabindex="-1">168h · Long-run</div>
        </div>
      </div>
    </div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main id="runnerCards" class="runners-list" aria-label="PASI runners"></main>

  <section id="scripts" aria-label="PASI userscripts"></section>

  <section id="idleState" class="idle-state" hidden aria-live="polite">
    <div class="idle-icon" aria-hidden="true">⚠️</div>
    <div class="idle-title">Ready</div>
    <div class="idle-copy">Ready to execute on this ChatGPT page.</div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
