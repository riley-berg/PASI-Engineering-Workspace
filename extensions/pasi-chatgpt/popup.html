<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PASI Dashboard</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand-group">
      <span class="brand">PASI Dashboard</span>
      <span id="connectionBadge" class="status-badge">Connected</span>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" title="Switch to light theme" aria-label="Switch to light theme">🌙</button>
  </header>

  <section id="runnerControls" class="runner-controls" aria-label="Runner controls">
    <div class="profile-summary">
      <span class="profile-label">Selected runner</span>
      <div class="runner-picker">
        <button
          id="runnerSelect"
          class="runner-select"
          type="button"
          role="combobox"
          aria-label="Selected runner"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="runnerSelectMenu"
        >
          <span id="runnerSelectLabel">M1 · 20-operation acceptance</span>
          <span class="runner-select-chevron" aria-hidden="true">▾</span>
        </button>
        <div id="runnerSelectMenu" class="runner-select-menu" role="listbox" hidden>
          <div id="runnerOption-m1" class="runner-select-option" role="option" aria-selected="true" data-value="m1" tabindex="-1">M1 · 20-operation acceptance</div>
          <div id="runnerOption-168h" class="runner-select-option" role="option" aria-selected="false" data-value="168h" tabindex="-1">168h · long-run acceptance</div>
        </div>
      </div>
    </div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main id="runnerCards" class="runners-list" aria-label="PASI runners"></main>

  <section id="scripts" aria-label="PASI userscripts"></section>

  <section id="idleState" class="idle-state" hidden aria-live="polite">
    <div class="idle-icon" aria-hidden="true">⚠️</div>
    <div class="idle-title">Extension idle</div>
    <div class="idle-copy">Navigate to a supported page to activate userscripts.</div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
