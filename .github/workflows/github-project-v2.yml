name: PASI Project roadmap reconciliation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-project-v2.yml"
      - "scripts/github_project_v2.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without changing the Project"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pasi-project-roadmap-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reconcile canonical PASI roadmap Project
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(python scripts/github_project_v2.py)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          "${args[@]}"

# Canonical PASI roadmap reconciler targets Project #5 by discovery.
