<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PASI Dashboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand-group">
      <span class="brand">PASI Dashboard</span>
      <span id="connectionBadge" class="status-badge">Ready</span>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle" type="button" title="Toggle UI Mode" aria-label="Toggle UI Mode">🌙</button>
      <a href="options.html" target="_blank">Dashboard</a>
    </div>
  </header>

  <div class="profile-summary">
    Selected profile: <strong id="profileSummary">M1 · 20-operation acceptance</strong>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main id="runnerCards" class="runners-list" aria-label="PASI runners"></main>

  <section id="scripts" aria-label="PASI userscripts"></section>

  <footer id="systemWarning" class="system-warning">
    ⚠️ No PASI userscripts match this page.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
