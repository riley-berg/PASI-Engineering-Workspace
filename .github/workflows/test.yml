name: test

on:
  push:
    branches: [main, 'pasi/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pasi-engineering-workspace-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Build userscript TypeScript compiler
        run: npm install --no-save typescript@7.0.2 typescript-browser@npm:typescript@6.0.3 && npm run build:userscript-compiler

      - name: Lint userscript platform
        run: npm install --no-save eslint@10.11.0 && npm run lint:userscripts

      - name: Test native extension runtime
        run: npm run test:extension

      - name: Run authoritative repository validation
        run: bash scripts/test_full_repo.sh
