name: temporary-project-v2-roadmap-date-sync

on:
  push:
    branches:
      - pasi/project-v2-roadmap-sync-20260927

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync Project V2 roadmap fields
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
        run: python scripts/sync_project_v2_roadmap_dates_20260927.py
