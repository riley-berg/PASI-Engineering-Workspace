name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: P0.4 clean-environment smoke
        run: |
          env -u PYTHONPATH python scripts/pasi_168h_acceptance.py --hours 168 --smoke
          bash -n scripts/run_p0_4_168h.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Frontend tests
        run: node --test web/app.test.js
      - name: Extension tests
        run: node --test extensions/pasi-chatgpt/src/test_*.cjs
