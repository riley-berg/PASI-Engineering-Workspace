name: repository-hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run non-destructive repository hygiene audit
        run: python scripts/pasi_repository_hygiene.py --strict --json
      - name: Verify canonical browser contract
        run: |
          python scripts/pasi_engineering_browser_preflight.py             --extension-root "$GITHUB_WORKSPACE/extensions/pasi-chatgpt"             --no-start
